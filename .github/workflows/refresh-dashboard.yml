name: Refresh dashboard

on:
  schedule:
    - cron: "17 18 * * *"   # every day at 02:17 Singapore time (18:17 UTC)
  workflow_dispatch:         # "Run workflow" button on the Actions tab
  push:
    branches: [main]
    paths-ignore:
      - "data/latest_meta.json"
      - "README.md"

permissions:
  contents: write   # to commit data/latest_meta.json (keeps the schedule alive + a refresh log)
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # The four pre-2017 datasets are pulled from the API too, but only re-pulled weekly
      # (fetch.py decides); in between, the cached copy is reused. A unique key per run
      # means the latest copies are saved every time; restore-keys picks up the newest.
      - name: Restore pre-2017 datasets from cache
        uses: actions/cache@v4
        with:
          path: |
            data/raw/d_ebc5ab87086db484f88045b47411ebc5.csv*
            data/raw/d_43f493c6c50d54243cc1eab0df142d6a.csv*
            data/raw/d_2d5ff9ea31397b66239f245f57751537.csv*
            data/raw/d_ea9ed51da2787afaf8e51f827c304208.csv*
          key: hdb-static-eras-${{ github.run_id }}
          restore-keys: hdb-static-eras-

      - name: Fetch data from data.gov.sg (2017+ every run, pre-2017 weekly)
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: python pipeline/fetch.py

      - name: Harmonize
        run: python pipeline/harmonize.py

      - name: Aggregate + build dashboard
        run: python pipeline/build.py

      - name: Validate page JavaScript
        run: |
          python - <<'EOF'
          import re
          h = open("site/index.html").read()
          open("/tmp/page.js", "w").write("\n".join(re.findall(r"<script>(.*?)</script>", h, re.S)))
          EOF
          node --check /tmp/page.js
          cat site/meta.json

      - name: Record refresh (commit only if the data changed)
        run: |
          python - <<'EOF'
          import json
          m = json.load(open("site/meta.json")); m.pop("built_at", None)
          json.dump(m, open("data/latest_meta.json", "w"), indent=1)
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/latest_meta.json
          git diff --cached --quiet || (git commit -m "Data refresh: $(python -c 'import json;m=json.load(open("data/latest_meta.json"));print(m["latest_month"], m["total_tx"], "transactions")')" && git pull --rebase -q && git push)

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
